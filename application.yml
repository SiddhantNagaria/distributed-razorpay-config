#centralize the configuration of all micro services in the application so configuration would 
#      be fetched from single source only
#      we dont have to manage conifguration everywhere for all the microservices

# if you ever want to update configuration of any micro services, its just a matter of hitting one actuator end point
#      and no redeployment needed until you change the code instead of configurations.


spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    username: postgres
    password: root@123
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: razorpay-clone-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.project.razorpay.*"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

app:
  kafka:
    topics:
      payment: payments.events
      order: order.events
      refund: refunds.events
      settlement: settlements.events
